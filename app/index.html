<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Depósito - Baixar Aplicativo</title>
    <meta name="description" content="Baixe o aplicativo Desafio Depósito e alcance suas metas financeiras.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta http-equiv="refresh" content="3;url=/#download">
    <script>
        (function() {
            var ua = navigator.userAgent || '';
            var isAndroid = /Android/i.test(ua);
            var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (isAndroid) {
                window.location.replace('https://play.google.com/store/apps/details?id=com.desafio.deposito');
            } else if (isIOS) {
                window.location.replace('https://www.apple.com/br/app-store/');
            } else {
                window.location.replace('/#download');
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #F1F5F9;
            color: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .redirect-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }
        .logo-img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: cover;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.15);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(22, 163, 74, 0.15);
            border-top-color: #16A34A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0F172A;
        }
        p {
            font-size: 0.95rem;
            color: #64748B;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .fallback-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: #16A34A;
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: #15803D;
        }
        .btn-secondary {
            background-color: #F8FAFC;
            color: #0F172A;
            border: 1px solid #E2E8F0;
        }
        .btn-secondary:hover {
            background-color: #F1F5F9;
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <img src="/favicon.png" alt="Desafio Depósito Logo" class="logo-img">
        <div class="spinner"></div>
        <h1>Redirecionando...</h1>
        <p>Estamos te levando para a loja oficial do seu dispositivo para baixar o Desafio Depósito.</p>
        <div class="fallback-links">
            <a id="btn-redirect-dynamic" class="btn btn-primary" href="/#download">Abrir na Loja Oficial</a>
            <a class="btn btn-secondary" href="/#download">Ir para a Página Inicial</a>
        </div>
    </div>

    <script>
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var dynamicBtn = document.getElementById('btn-redirect-dynamic');

        if (isAndroid) {
            dynamicBtn.href = 'https://play.google.com/store/apps/details?id=com.desafio.deposito';
            dynamicBtn.textContent = 'Abrir no Google Play';
        } else if (isIOS) {
            dynamicBtn.href = 'https://www.apple.com/br/app-store/';
            dynamicBtn.textContent = 'Abrir na App Store';
        } else {
            dynamicBtn.href = '/#download';
            dynamicBtn.textContent = 'Ver Opções de Download';
        }
    </script>
</body>
</html>
